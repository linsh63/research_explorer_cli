name: C0-C5 release candidate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  c5:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Research Explorer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout pinned Core
        uses: actions/checkout@v4
        with:
          repository: linsh63/research_explorer_core
          ref: 2347be17c6d6d913d3a96e2f29cead419f646194
          path: core
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Build Core
        run: npm ci && npm run build
        working-directory: core
      - name: Install CLI
        run: npm ci
      - name: Unit and C0 regression
        run: npm run check && npm test && npm run validate:c0
      - name: Real Core C1 acceptance
        run: npm run validate:c1
        env:
          C1_CORE_ENTRY: ${{ github.workspace }}/core/dist/service/cli.js
      - name: Real Core C2 acceptance
        run: npm run validate:c2
        env:
          C2_CORE_ENTRY: ${{ github.workspace }}/core/dist/service/cli.js
      - name: Real Core C3 acceptance
        run: npm run validate:c3
        env:
          C3_CORE_ENTRY: ${{ github.workspace }}/core/dist/service/cli.js
      - name: Real Core C4 acceptance
        run: npm run validate:c4
        env:
          C4_CORE_ENTRY: ${{ github.workspace }}/core/dist/service/cli.js
      - name: C5 release audit
        run: npm run validate:c5
        env:
          C5_CORE_ENTRY: ${{ github.workspace }}/core/dist/service/cli.js

  user-install:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout installer
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Install published Core and current CLI into user prefix
        run: |
          bash scripts/install-user.sh --core-only --prefix "$RUNNER_TEMP/research-explorer-prefix"
          npm install -g --prefix "$RUNNER_TEMP/research-explorer-prefix" --no-audit --no-fund .
      - name: Start rexplore from unrelated directory
        run: |
          mkdir -p "$RUNNER_TEMP/unrelated-work"
          cd "$RUNNER_TEMP/unrelated-work"
          export PATH="$RUNNER_TEMP/research-explorer-prefix/bin:$PATH"
          export RESEARCH_EXPLORER_HOME="$RUNNER_TEMP/research-explorer-home"
          rexplore --offline --no-session --print '/research-doctor'
          node -e 'const fs=require("fs");const p=process.env.RESEARCH_EXPLORER_HOME+"/core/core-service.json";const d=JSON.parse(fs.readFileSync(p,"utf8"));if(d.capabilities.serviceVersion!=="1.0.0")process.exit(1);process.kill(d.pid,"SIGTERM")'
